name: Claude Code

# On-demand @claude in issues, PR comments, and reviews.
# Only users with write access can trigger it (the action's default; allowed_non_write_users is unset).
# Claude works on claude/* branches and links a PR for a human to open; it never pushes to main.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # commit to claude/* branches when asked to make changes
      pull-requests: write  # reply on PRs
      issues: write         # reply on issues
      id-token: write       # OIDC exchange for the Claude GitHub App token
      actions: read         # read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          use_sticky_comment: true
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(./.env)",
                  "Read(./.env.*)",
                  "Read(./**/.env)",
                  "Read(./**/.env.*)",
                  "Read(./**/*.pem)",
                  "Read(./**/*credentials*.json)"
                ]
              }
            }
