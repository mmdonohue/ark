name: Claude Code Review

# Automatic review on every non-draft PR from this repository.
# Fork PRs are skipped: they never receive secrets, and their content is untrusted.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read        # checkout
      pull-requests: write  # inline review comments and the summary comment
      id-token: write       # OIDC exchange for the Claude GitHub App token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow CLAUDE.md for project conventions.

            Focus on, in priority order:
            - Correctness bugs and regressions
            - Security issues (auth, injection, secret handling, unescaped output)
            - Data integrity (Supabase writes, migrations, payments)
            - Missing or weak tests for changed behavior

            Rules:
            - Report only real, specific problems. No style nits, no praise, no restating the diff.
            - Use inline comments for issues tied to specific lines.
            - Finish with one short `gh pr comment` summary. If you found nothing worth flagging, say so in one line.
            - Never read, print, or quote environment files, secrets, or credentials.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(./.env)",
                  "Read(./.env.*)",
                  "Read(./**/.env)",
                  "Read(./**/.env.*)",
                  "Read(./**/*.pem)",
                  "Read(./**/*credentials*.json)"
                ]
              }
            }
