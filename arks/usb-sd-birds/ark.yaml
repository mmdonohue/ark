# folder to another machine still needs that machine's own ark/ checkout +
# npm install, not just this directory.
#
# "ark" here means a standalone runtime instance (this folder) — distinct
# from the CLI binary and from the graph-level artifact_type:'ark' container
# any instance can hold many of internally (see actions/ArkActions.js).

